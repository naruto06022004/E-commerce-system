version: '3.8'

services:
  department-service:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: department-service
    
    # 1. Ép lấy context tại thư mục gốc để tự đóng gói
    build:
      context: .
      dockerfile: Dockerfile

    # 2. CHÍ MẠNG: Chỉ pull nếu dưới máy ảo KHÔNG CÓ SẴN image này
    pull_policy: if_not_present

    ports:
      - '${APP_PORT}:${APP_PORT}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_PORT=${APP_PORT}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always