version: '3.8'

services:
  department-service:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: department-service
    
    # Ép lấy luôn context build tại thư mục gốc mà không cần chỉ định thư mục con
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: if_not_present
    ports:
      - '${APP_PORT}:${APP_PORT}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_PORT=${APP_PORT}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always
