spring:
  application:
    name: orders-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:mysql://localhost:3306/orderservice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "123456789"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect # Nên dùng MySQL8Dialect cho MySQL 8.x
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orders-group # Nên đặt tên group cụ thể cho service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

# Cấu hình để gọi service khác
services:
  product:
    base-url: http://localhost:8083

# Cấu hình đăng ký với Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Kiểm tra lại port của Eureka Server (thường là 8761)
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true