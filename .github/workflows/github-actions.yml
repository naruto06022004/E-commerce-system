name: Build and Deploy

on:
  push:
    branches:
      - dev
      - main

env:
  # 1. Đổi tên IMAGE_NAME thành dịch vụ bạn muốn test (Ví dụ: orders-service)
  IMAGE_NAME: doductuyen/orders-service
  IMAGE_TAG: ${{ github.sha }}
  # 2. Điền chính xác tên thư mục con chứa dịch vụ đó dưới máy của bạn
  WORKING_DIR: orders-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven
        # Ép Maven nhảy vào đúng thư mục con để tìm file pom.xml
        run: mvn clean package -DskipTests
        working-directory: ${{ env.WORKING_DIR }}

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
        working-directory: ${{ env.WORKING_DIR }}

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-develop:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'
    environment: develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log status
        run: echo "Ready to deploy ${{ env.IMAGE_NAME }} to dev environment"