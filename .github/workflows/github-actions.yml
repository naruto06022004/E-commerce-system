# Tạo lại thư mục workflows nếu chưa có
New-Item -ItemType Directory -Force -Path ".github/workflows"

@'
name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
  IMAGE_TAG: ${{ github.sha }}
  APP_PORT: 8080
  DB_URL: jdbc:mysql://host.docker.internal:3306/your_database
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Tự động build tất cả các module có file pom.xml
      - name: Build All Maven Modules
        run: mvn clean package -DskipTests

      # 2. Tự động quét tìm file .jar của service con và lôi ra thư mục gốc
      - name: Auto Find and Move JAR to Root
        run: |
          find . -name "*.jar" -not -path "*/target/wro/*" -exec cp {} ./app.jar \;

      # 3. Tự động tạo Dockerfile xịn ngay tại thư mục gốc để Docker Compose bốc
      - name: Create Root Dockerfile
        run: |
          echo 'FROM openjdk:17-jdk-alpine' > Dockerfile
          echo 'COPY app.jar app.jar' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'ENTRYPOINT ["java","-jar","/app.jar"]' >> Dockerfile

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Bơm biến môi trường điền đầy đủ cho cả 3 file của bạn
      - name: Render Environment Variables
        run: |
          envsubst < docker-compose.yml > docker-compose.rendered.yml && mv docker-compose.rendered.yml docker-compose.yml
          envsubst < deployment.yaml > deployment.rendered.yaml && mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml && mv service.rendered.yaml service.yaml

      # 5. Build Image local bằng Docker Compose
      - name: Build with Docker Compose
        run: docker compose build

      # 6. Khởi chạy cụm hệ thống lên mượt mà
      - name: Up Docker Compose Environment
        run: docker compose up -d
'@ | Set-Content -Path ".github/workflows/github-actions.yml" -Encoding UTF8