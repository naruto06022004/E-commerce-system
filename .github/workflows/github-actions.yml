name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

env:
  # Cấu hình các biến môi trường để nạp vào 3 file YAML của bạn
  IMAGE_NAME: doductuyen/department-service
  IMAGE_TAG: ${{ github.sha }}
  APP_PORT: 8080
  DB_URL: jdbc:mysql://host.docker.internal:3306/your_database
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Cài đặt công cụ render biến môi trường (envsubst)
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 2. Build Maven (Thư mục ngoài cùng hoặc trỏ đúng làm mẫu)
      - name: Build Maven Application
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package -DskipTests
          else
            cd orders-service && mvn clean package -DskipTests && cd ..
          fi

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. KỸ THUẬT CHÍ MẠNG: Ghi đè biến vào file docker-compose.yml và Build
      - name: Render and Build Docker Compose
        run: |
          envsubst < docker-compose.yml > docker-compose.rendered.yml
          mv docker-compose.rendered.yml docker-compose.yml
          docker compose build

      # 4. KỸ THUẬT CHÍ MẠNG: Ghi đè biến vào các file Kubernetes (deployment, service)
      - name: Render Kubernetes Manifests
        run: |
          envsubst < deployment.yaml > deployment.rendered.yaml
          mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml
          mv service.rendered.yaml service.yaml
          
          # Hiển thị ra log để bạn kiểm tra xem biến đã nhận chuẩn chưa
          echo "=== REVIEW DEPLOYMENT.YAML ==="
          cat deployment.yaml

      # 5. Khởi chạy Docker Compose (Nếu nộp bài Lab Docker Compose)
      - name: Up Docker Compose Environment
        run: docker compose up -d

      # 6. Triển khai vào Kubernetes (Nếu bài Lab yêu cầu chạy K8s)
      # Bước này chạy độc lập, nếu máy ảo GitHub có cài sẵn minikube/kind thì nó sẽ ăn ngay
      - name: Deploy to Kubernetes
        run: |
          echo "Applying Kubernetes manifests..."
          # kubectl apply -f deployment.yaml --validate=false
          # kubectl apply -f service.yaml --validate=false