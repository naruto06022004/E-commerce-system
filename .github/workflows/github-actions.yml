name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Tự động build code Java ra file JAR
      - name: Build All Maven Modules
        run: mvn clean package -DskipTests

      # 2. Tự động quét và đưa file .jar ra thư mục gốc
      - name: Auto Find and Move JAR to Root
        run: |
          find . -name "*.jar" -not -path "*/target/wro/*" -exec cp {} ./app.jar \;

      # 3. Tạo Dockerfile chuẩn ngay tại thư mục gốc để Docker Compose build
      - name: Create Temporary Root Dockerfile
        run: |
          echo 'FROM openjdk:17-jdk-alpine' > Dockerfile
          echo 'COPY app.jar app.jar' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'ENTRYPOINT ["java","-jar","/app.jar"]' >> Dockerfile

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. SỬA TẠI ĐÂY: Bỏ hoàn toàn dòng render docker-compose để bảo vệ file cấu hình gốc
      - name: Render Kubernetes Manifests
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: 8080
        run: |
          envsubst < deployment.yaml > deployment.rendered.yaml && mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml && mv service.rendered.yaml service.yaml

      # 5. Ép Docker Compose build image local với đúng Tên và Tag tương ứng
      - name: Build with Docker Compose
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: 8080
        run: docker compose build

      # 6. Khởi chạy container bằng chính image local vừa build
      - name: Up Docker Compose Environment
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
          IMAGE_TAG: ${{ github.sha }}
          APP_PORT: 8080
          DB_URL: jdbc:mysql://host.docker.internal:3306/your_database
          DB_USERNAME: root
          DB_PASSWORD: root
        run: docker compose up -d