name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
  IMAGE_TAG: ${{ github.sha }}
  APP_PORT: 8080
  DB_URL: jdbc:mysql://host.docker.internal:3306/your_database
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Tự động đóng gói tất cả các module có file pom.xml
      - name: Build All Maven Modules
        run: mvn clean package -DskipTests

      # 2. Tự động tìm kiếm file .jar vừa build xong của service con và đưa ra thư mục gốc
      - name: Auto Find and Move JAR to Root
        run: |
          find . -name "*.jar" -not -path "*/target/wro/*" -exec cp {} ./app.jar \;

      # 3. Tự động tạo một file Dockerfile chuẩn tại thư mục gốc để Docker Compose bốc
      - name: Create Temporary Root Dockerfile
        run: |
          echo 'FROM openjdk:17-jdk-alpine' > Dockerfile
          echo 'COPY app.jar app.jar' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'ENTRYPOINT ["java","-jar","/app.jar"]' >> Dockerfile

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. CHỈ RENDER BIẾN CHO KUBERNETES (BỎ DÒNG RENDER DOCKER-COMPOSE ĐI)
      - name: Render Environment Variables
        run: |
          envsubst < deployment.yaml > deployment.rendered.yaml && mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml && mv service.rendered.yaml service.yaml

      # 5. Tiến hành Build Image bằng Docker Compose (Nạp biến môi trường trực tiếp tại đây)
      - name: Build with Docker Compose
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose build

      # 6. Khởi chạy container local (Nạp biến môi trường trực tiếp tại đây)
      - name: Up Docker Compose Environment
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose up -d

      # 5. Tiến hành Build Image bằng Docker Compose
      - name: Build with Docker Compose
        run: docker compose build

      # 6. Khởi chạy container local mượt mà
      - name: Up Docker Compose Environment
        run: docker compose up -d