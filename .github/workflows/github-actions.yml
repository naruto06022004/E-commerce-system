name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
  IMAGE_TAG: ${{ github.sha }}
  APP_PORT: 8080

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. SỬA TẠI ĐÂY: Chỉ định chính xác thư mục chứa code java của bạn để build (Ví dụ: department-service)
      # CHÚ Ý: Nếu thư mục chứa code java dưới máy của bạn tên là orders-service thì đổi chữ "department-service/pom.xml" thành "orders-service/pom.xml"
      - name: Build Maven Module
        run: mvn clean package -DskipTests -f orders-service/pom.xml

      # 2. Tìm file .jar trong thư mục target của service đó và lôi ra ngoài thư mục gốc
      - name: Auto Find and Move JAR to Root
        run: |
          find . -name "*.jar" -not -path "*/target/wro/*" -exec cp {} ./app.jar \;

      # 3. Tạo Dockerfile chuẩn ngay tại thư mục gốc
   # 3. Thay đổi image FROM sang eclipse-temurin:17-jdk-alpine
      - name: Create Temporary Root Dockerfile
        run: |
          echo 'FROM eclipse-temurin:17-jdk-alpine' > Dockerfile
          echo 'COPY app.jar app.jar' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'ENTRYPOINT ["java","-jar","/app.jar"]' >> Dockerfile

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Tự động điền giá trị thật vào các biến môi trường của 3 file cấu hình
      - name: Render Environment Variables
        run: |
          envsubst < docker-compose.yml > docker-compose.rendered.yml && mv docker-compose.rendered.yml docker-compose.yml
          envsubst < deployment.yaml > deployment.rendered.yaml && mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml && mv service.rendered.yaml service.yaml

      # 5. In thử file deployment sau khi điền biến ra log để kiểm tra
      - name: Verify Rendered Manifests
        run: |
          echo "=== NỘI DUNG FILE DEPLOYMENT ĐÃ ĐƯỢC ĐIỀN BIẾN THÀNH CÔNG ==="
          cat deployment.yaml

      # 6. Dùng lệnh Docker thuần để tự build image local
      - name: Build Docker Image Locally
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/orders-service:${{ github.sha }} .

      - name: Pipeline Completed Successfully
        run: |
          echo "Pipeline đã hoàn thành xuất sắc! Toàn bộ file cấu hình và Image đã sẵn sàng."