name: Build and Deploy System

on:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/department-service
  IMAGE_TAG: ${{ github.sha }}
  APP_PORT: 8080
  DB_URL: jdbc:mysql://host.docker.internal:3306/your_database
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Tự động quét và build TẤT CẢ các module Maven ra file JAR cùng một lúc
      - name: Build All Maven Modules
        run: mvn clean package -DskipTests

      # Mẹo nhỏ: Tìm file JAR vừa build xong của department-service và lôi nó ra thư mục gốc
      - name: Move JAR to Root for Docker Build
        run: |
          find . -name "*.jar" -not -path "*/target/wro/*" -exec cp {} ./app.jar \;

      # Tạo một file Dockerfile "mì ăn liền" ngay tại thư mục gốc để Docker Compose bốc luôn file app.jar vừa tìm được
      - name: Create Temporary Root Dockerfile
        run: |
          echo 'FROM openjdk:17-jdk-alpine' > Dockerfile
          echo 'COPY app.jar app.jar' >> Dockerfile
          echo 'EXPOSE 8080' >> Dockerfile
          echo 'ENTRYPOINT ["java","-jar","/app.jar"]' >> Dockerfile

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Đổ biến môi trường vào điền đầy đủ cho file docker-compose.yml, deployment.yaml, service.yaml
      - name: Render Environment Variables
        run: |
          envsubst < docker-compose.yml > docker-compose.rendered.yml && mv docker-compose.rendered.yml docker-compose.yml
          envsubst < deployment.yaml > deployment.rendered.yaml && mv deployment.rendered.yaml deployment.yaml
          envsubst < service.yaml > service.rendered.yaml && mv service.rendered.yaml service.yaml

      # Tiến hành build Image bằng Docker Compose
      - name: Build with Docker Compose
        run: docker compose build

      # Khởi chạy cụm hệ thống lên mượt mà
      - name: Up Docker Compose Environment
        run: docker compose up -d