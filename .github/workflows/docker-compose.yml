services:
  department-service:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: department-service
    
    # 1. Thêm cụm này để ép Docker Compose tự build từ thư mục orders-service
    build:
      context: ./orders-service
      dockerfile: Dockerfile

    # 2. Đổi pull_policy thành if_not_present để ưu tiên dùng hàng vừa build xong dưới máy ảo
    pull_policy: if_not_present

    ports:
      - '${APP_PORT}:${APP_PORT}'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_PORT=${APP_PORT}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always